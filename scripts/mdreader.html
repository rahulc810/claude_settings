<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>md reader</title>
<style>
:root{--bg:#fbfbfa;--panel:#f2f1ee;--line:#e0ded8;--fg:#1f1e1c;--dim:#78736b;
  --accent:#8a5a2b;--sel:#e6e2d8;--code:#f0eee9;--drop:rgba(138,90,43,.08);
  --body:#3b3833;      /* body text: softened so bold stands out */
  --strong:#12110f;    /* bold: maximum contrast */
  --h1:#1f1e1c; --h2:#8a5a2b; --h3:#2f6f6a; --h4:#6a5aa0;
  --rule2:#d9c3a5; --rule3:#a9cdc8; --zebra:#f7f6f3;
  --codefg:#9c3f2c; --codebg:#f6ece6; --codebd:#e5cfc2;
  --link:#2b5fa8; --dead:#b0a89c;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"JetBrains Mono","Cascadia Mono",Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#191817;--panel:#201f1d;--line:#33312e;
  --fg:#e6e3dd;--dim:#8f8a81;--accent:#d8a05e;--sel:#2e2b26;--code:#232120;
  --drop:rgba(216,160,94,.10);
  --body:#c9c5bd; --strong:#fbf9f4;
  --h1:#f0ede7; --h2:#d8a05e; --h3:#7fc9bf; --h4:#a99ae0;
  --rule2:#5a4630; --rule3:#33544f; --zebra:#1e1d1b;
  --codefg:#f0a487; --codebg:#2b2320; --codebd:#42332c;
  --link:#8fb6ea; --dead:#6a635b}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  background:var(--bg);color:var(--fg)}
#side{width:300px;min-width:170px;flex:none;background:var(--panel);
  border-right:1px solid var(--line);display:flex;flex-direction:column}
#top{padding:9px;border-bottom:1px solid var(--line);display:flex;gap:7px}
#top{gap:5px}
#b-collapse,#b-expand{padding:5px 9px !important;font-size:14px !important;line-height:1}
#top button{font:inherit;font-size:12.5px;padding:5px 11px;border:1px solid var(--line);
  background:var(--bg);color:var(--fg);border-radius:6px;cursor:pointer;white-space:nowrap}
#top button:hover{border-color:var(--accent);color:var(--accent)}
#rootname{padding:7px 12px;font-size:11.5px;color:var(--dim);
  text-transform:uppercase;letter-spacing:.05em;overflow:hidden;text-overflow:ellipsis}
#tree{overflow:auto;padding:0 0 20px 4px;flex:1}
#tree ul{list-style:none;margin:0;padding-left:13px}
#tree>ul{padding-left:4px}
.row{display:flex;align-items:baseline;gap:5px;padding:2.5px 6px;border-radius:4px;
  cursor:pointer;white-space:nowrap;overflow:hidden}
.row:hover{background:var(--sel)}
.row.on{background:var(--sel);color:var(--accent);font-weight:600}
.tw{width:9px;flex:none;color:var(--dim);font-size:9px}
.nm{overflow:hidden;text-overflow:ellipsis}
.dir>.nm{color:var(--dim);font-size:12px;letter-spacing:.03em}
.file>.nm{font-size:13px}
#grip{width:5px;flex:none;cursor:col-resize}
#grip:hover{background:var(--accent)}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#crumb{flex:none;border-bottom:1px solid var(--line);padding:9px 30px;
  font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stage{flex:1;overflow:auto}
#doc{max-width:820px;margin:0 auto;padding:30px 46px 40px}
#doc>:first-child{margin-top:0}
#doc{color:var(--body);line-height:1.65}
#doc h1,#doc h2,#doc h3,#doc h4{line-height:1.3;font-weight:700}
#doc h1{font-size:25px;color:var(--h1);margin:0 0 .7em;
  border-bottom:2px solid var(--line);padding-bottom:.35em}
#doc h2{font-size:20px;color:var(--h2);margin:0 0 .65em;
  border-bottom:2px solid var(--rule2);padding-bottom:.3em}
#doc h3{font-size:16px;color:var(--h3);margin:0 0 .55em;
  border-left:3px solid var(--rule3);padding-left:9px}
#doc h4{font-size:13.5px;color:var(--h4);margin:0 0 .5em;
  text-transform:uppercase;letter-spacing:.06em}
#doc p{margin:0 0 .95em}
#doc strong,#doc b{color:var(--strong);font-weight:680}
#doc em{color:var(--h2);font-style:italic}
#doc ul,#doc ol{padding-left:1.45em;margin:0 0 1em}
#doc li{margin:0 0 .55em}
#doc li:last-child{margin-bottom:0}
#doc li>ul,#doc li>ol{margin:.45em 0 .2em}
#doc li li{margin:0 0 .3em}
#doc li::marker{color:var(--h2);font-weight:700}
#doc ol li::marker{color:var(--h3)}
#doc code{font-family:var(--mono);font-size:12.5px;background:var(--codebg);
  color:var(--codefg);border:1px solid var(--codebd);border-radius:5px;
  padding:1px 5px;white-space:nowrap}
/* inside a heading, let the heading's own colour win — a second hue there is noise */
#doc h1 code,#doc h2 code,#doc h3 code,#doc h4 code{color:inherit;font-size:.92em;
  background:var(--codebg);border-color:transparent;padding:0 4px}
/* links that are code keep the link colour */
#doc a code{color:var(--link);border-color:color-mix(in srgb,var(--link) 35%,transparent)}
#doc pre{background:var(--code);border:1px solid var(--line);border-radius:7px;
  padding:12px 14px;overflow-x:auto;margin:0 0 1em}
#doc pre code{font-family:var(--mono);background:none;padding:0;border:0;
  font-size:12.5px;line-height:1.55;color:var(--body);white-space:pre}
#doc table{border-collapse:collapse;font-size:13px;margin:0 0 1.1em;display:block;overflow-x:auto}
#doc th,#doc td{border:1px solid var(--line);padding:7px 11px;text-align:left}
#doc td code{white-space:normal}
#doc th{background:var(--panel);color:var(--strong);font-weight:700}
#doc tbody tr:nth-child(even){background:var(--zebra)}
#doc blockquote{margin:0 0 1em;padding:2px 0 2px 14px;border-left:3px solid var(--rule2);
  color:var(--dim)}
#doc a{color:var(--link);text-decoration-color:color-mix(in srgb,var(--link) 40%,transparent);
  text-underline-offset:2px;text-decoration-thickness:1px}
#doc a:hover{text-decoration-color:var(--link);text-decoration-thickness:2px}
#doc a.ext::after{content:"\2197";font-size:.8em;vertical-align:.25em;margin-left:1px;opacity:.7}
#doc a.dead{color:var(--dead);text-decoration-style:dotted;cursor:help}
#doc a.dead::after{content:"\00a0(not in this folder)";font-size:.82em;opacity:.75}
#doc hr{border:0;border-top:1px solid var(--line);margin:1.6em 0}
.mermaid{text-align:center;margin:1.3em 0}
.mermaid-fail{font-size:.85em;color:#a33;margin:1.3em 0 .3em}
#nav{flex:none;display:flex;align-items:center;justify-content:center;gap:9px;
  padding:9px;border-top:1px solid var(--line);background:var(--panel)}
#nav button{font:inherit;font-size:12.5px;padding:5px 13px;border:1px solid var(--line);
  background:var(--bg);color:var(--fg);border-radius:6px;cursor:pointer}
#nav button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
#nav button:disabled{opacity:.32;cursor:default}
.sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
#pos{min-width:104px;text-align:center;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
#right{width:250px;min-width:150px;flex:none;background:var(--panel);
  border-left:1px solid var(--line);display:flex;flex-direction:column}
#right.hide{display:none}
#rhead{display:flex;justify-content:space-between;padding:11px 12px 9px;
  border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--dim)}
#rcount{font-variant-numeric:tabular-nums}
#outline{overflow:auto;padding:6px 4px 20px;flex:1}
.orow{display:flex;gap:7px;align-items:baseline;padding:4px 8px;border-radius:4px;
  cursor:pointer;font-size:12.5px;line-height:1.35;color:var(--dim)}
.orow:hover{background:var(--sel);color:var(--fg)}
.orow.on{background:var(--sel);color:var(--h2);font-weight:650}
.orow .n{flex:none;font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums;
  min-width:17px;text-align:right}
.orow .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow.l1 .t{font-weight:700;color:var(--h1)}
.orow.l3 .t{padding-left:10px}
.orow.l4 .t{padding-left:20px}
#rgrip{width:5px;flex:none;cursor:col-resize}
#rgrip:hover{background:var(--accent)}
#hint{padding:52px 46px;max-width:620px;color:var(--dim)}
#hint b{color:var(--fg)}
body.drag{background:var(--drop)}
body.drag #main{outline:2px dashed var(--accent);outline-offset:-14px}
</style></head><body>

<div id="side">
  <div id="top">
    <button id="b-open">Open folder</button>
    <button id="b-collapse" title="Collapse all folders">&#8863;</button>
    <button id="b-expand" title="Expand all folders">&#8862;</button>
    <input id="b-input" type="file" webkitdirectory multiple hidden>
  </div>
  <div id="rootname">no folder</div>
  <div id="tree"></div>
</div>
<div id="grip"></div>
<div id="main">
  <div id="crumb">—</div>
  <div id="stage"><div id="doc"><div id="hint">
    <p><b>Drag a folder anywhere onto this window</b>, or click <b>Open folder</b>.</p>
    <p>Folders and <code>.md</code> files show on the left. Pick one and it shows on the
       right, one section at a time.</p>
    <p>&larr; &rarr; step &middot; PgUp / PgDn step &middot; Home / End jump to the ends.</p>
  </div></div></div>
  <div id="nav">
    <button id="b-back" disabled title="Back (Alt+&larr;)">&#8617; Back</button>
    <span class="sep"></span>
    <button id="b-home" disabled>&#8676; Home</button>
    <button id="b-prev" disabled>&larr; Prev</button>
    <span id="pos">—</span>
    <button id="b-next" disabled>Next &rarr;</button>
    <button id="b-end" disabled>End &#8677;</button>
  </div>
</div>
<div id="rgrip"></div>
<div id="right">
  <div id="rhead"><span>Sections</span><span id="rcount">—</span></div>
  <div id="outline"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<script>
const $=s=>document.querySelector(s), tree=$("#tree"), doc=$("#doc"), crumb=$("#crumb");
const HAS_MD=typeof marked!=="undefined";
if(typeof mermaid!=="undefined") mermaid.initialize({startOnLoad:false,securityLevel:"loose",
  theme:matchMedia("(prefers-color-scheme:dark)").matches?"dark":"neutral"});
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;
  if(x!==undefined)e.textContent=x;return e};
const SKIP=new Set([".git","node_modules","__pycache__",".venv",".idea"]);

/* ---------- markdown structure: fence-aware headings -> slides ---------- */
const MAXL=52, ORPHAN=12;   // measured in WRAPPED ROWS, not source lines
const COLS=92;              // approx chars per rendered row
const rows=ln=>Math.max(1,Math.ceil(ln.length/COLS));
const LIST=/^(?:[-*+]|\d+[.)])\s/;   // top-level list item = a legal cut point
const FENCE=/^\s*(```|~~~)/, HEAD=/^(#{1,4})\s+(.*)$/;

function headings(text){
  const out=[], lines=text.split("\n"); let fence=null;
  lines.forEach((ln,i)=>{
    const f=ln.match(FENCE);
    if(f){ const t=f[1];
      fence = fence===null ? t : (ln.trim().startsWith(fence)?null:fence);
      return; }
    if(fence) return;
    const m=ln.match(HEAD);
    if(m) out.push({level:m[1].length,text:m[2].trim(),line:i+1});
  });
  return out;
}

function slides(text){
  const lines=text.split("\n"), heads=headings(text), out=[];
  if(!heads.length) return [{title:"(no headings)",md:text,part:null}];
  const bounds=heads.map(h=>h.line).concat([lines.length+1]);
  heads.forEach((h,hi)=>{
    const body=lines.slice(h.line,bounds[hi+1]-1);
    while(body.length && !body[body.length-1].trim()) body.pop();
    let parts=[], cur=[], w=0, fence=null;
    for(const ln of body){
      const f=ln.match(FENCE);
      if(f){ const t=f[1];
        fence = fence===null ? t : (ln.trim().startsWith(fence)?null:fence); }
      // cut BEFORE a new top-level list item once the slide is full
      if(w>0 && w+rows(ln)>MAXL && fence===null && LIST.test(ln)){ parts.push(cur); cur=[]; w=0; }
      cur.push(ln); w+=rows(ln);
      // or cut AFTER a blank line
      if(w>=MAXL && fence===null && !ln.trim()){ parts.push(cur); cur=[]; w=0; }
    }
    if(cur.length || !parts.length) parts.push(cur);
    const tailRows=p=>p.reduce((a,l)=>a+(l.trim()?rows(l):0),0);
    if(parts.length>1 && tailRows(parts[parts.length-1])<ORPHAN){
      const tail=parts.pop(); parts[parts.length-1]=parts[parts.length-1].concat(tail);
    }
    parts.forEach((p,n)=>out.push({
      title:h.text, level:h.level,
      part: parts.length>1 ? [n+1,parts.length] : null,
      head:"#".repeat(h.level)+" "+h.text,
      body:p.join("\n"),
      md:"#".repeat(h.level)+" "+h.text+"\n\n"+p.join("\n")
    }));
  });

  // A heading with no body of its own is not a slide — fold it onto the next one,
  // so "## Steps" arrives attached to step 1 instead of as an empty card.
  const merged=[];
  for(let i=0;i<out.length;i++){
    const s=out[i], nx=out[i+1];
    if(!s.body.trim() && nx){ nx.md=s.head+"\n\n"+nx.md; continue; }
    merged.push(s);
  }
  return merged.length?merged:out;
}

/* ---------- folder loading: 3 routes ---------- */
let ROOT=null;   // {name, dirs:{}, files:[{name,path,get()}]}
const INDEX=new Map();   // relative path -> file record, for internal links
const mkdirNode=name=>({name,dirs:{},files:[]});

function place(root,relPath,getter){
  const parts=relPath.split("/"), fname=parts.pop();
  let n=root;
  for(const d of parts){ if(!n.dirs[d]) n.dirs[d]=mkdirNode(d); n=n.dirs[d]; }
  n.files.push({name:fname,path:relPath,get:getter});
}

async function fromHandle(dir,root,prefix=""){
  for await (const [name,h] of dir.entries()){
    if(name.startsWith(".")||SKIP.has(name)) continue;
    const rel=prefix?prefix+"/"+name:name;
    if(h.kind==="directory") await fromHandle(h,root,rel);
    else if(name.toLowerCase().endsWith(".md"))
      place(root,rel,async()=>(await h.getFile()).text());
  }
}

function walkEntry(entry,root,prefix=""){
  return new Promise(res=>{
    if(entry.isFile){
      const rel=prefix?prefix+"/"+entry.name:entry.name;
      if(entry.name.toLowerCase().endsWith(".md"))
        place(root,rel,()=>new Promise(r=>entry.file(f=>r(f.text()))));
      return res();
    }
    const rd=entry.createReader(), all=[];
    const step=()=>rd.readEntries(async es=>{
      if(!es.length){
        for(const e of all){
          if(e.name.startsWith(".")||SKIP.has(e.name)) continue;
          await walkEntry(e,root,prefix?prefix+"/"+entry.name:entry.name);
        }
        return res();
      }
      all.push(...es); step();
    });
    step();
  });
}

function loaded(root){
  ROOT=root; INDEX.clear(); $("#rootname").textContent=root.name||"folder";
  tree.textContent=""; renderTree(root,tree.appendChild(el("ul")));
  const n=countFiles(root);
  doc.innerHTML=""; doc.append(el("div","",""));
  crumb.textContent=`${root.name} — ${n} markdown file${n===1?"":"s"}`;
  doc.textContent=""; const h=el("div"); h.id="hint";
  h.append(el("p",null,n?"Pick a file on the left.":"No .md files found in that folder."));
  doc.append(h);
}
const countFiles=n=>n.files.length+Object.values(n.dirs).reduce((a,d)=>a+countFiles(d),0);

function setAllFolders(open){
  tree.querySelectorAll(".row.dir").forEach(r=>{
    const kids=r.nextElementSibling;
    if(!kids) return;
    kids.style.display=open?"":"none";
    r.firstChild.textContent=open?"\u25be":"\u25b8";
  });
}
$("#b-collapse").onclick=()=>setAllFolders(false);
$("#b-expand").onclick=()=>setAllFolders(true);

$("#b-open").onclick=async()=>{
  if(window.showDirectoryPicker){
    try{ const d=await window.showDirectoryPicker();
      const root=mkdirNode(d.name); await fromHandle(d,root); loaded(root);
    }catch(e){ if(e.name!=="AbortError") $("#b-input").click(); }
  } else $("#b-input").click();
};
$("#b-input").onchange=e=>{
  const fs=[...e.target.files].filter(f=>f.name.toLowerCase().endsWith(".md"));
  if(!fs.length) return;
  const top=fs[0].webkitRelativePath.split("/")[0], root=mkdirNode(top);
  for(const f of fs){
    const rel=f.webkitRelativePath.split("/").slice(1).join("/");
    if(rel.split("/").some(p=>p.startsWith(".")||SKIP.has(p))) continue;
    place(root,rel,()=>f.text());
  }
  loaded(root);
};
addEventListener("dragover",e=>{e.preventDefault();document.body.classList.add("drag")});
addEventListener("dragleave",e=>{if(!e.relatedTarget)document.body.classList.remove("drag")});
addEventListener("drop",async e=>{
  e.preventDefault(); document.body.classList.remove("drag");
  const items=[...e.dataTransfer.items].map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);
  if(!items.length) return;
  const root=mkdirNode(items.length===1?items[0].name:"dropped");
  if(items.length===1&&items[0].isDirectory){
    const rd=items[0].createReader(), all=[];
    await new Promise(res=>{const step=()=>rd.readEntries(es=>{
      if(!es.length) return res(); all.push(...es); step();}); step();});
    for(const en of all){ if(en.name.startsWith(".")||SKIP.has(en.name)) continue;
      await walkEntry(en,root); }
  } else for(const en of items) await walkEntry(en,root);
  loaded(root);
});

/* ---------- tree: folders + .md files only ---------- */
function renderTree(node,parent){
  for(const name of Object.keys(node.dirs).sort()){
    const li=el("li"), r=el("div","row dir"), kids=el("ul");
    r.append(el("span","tw","▾"), el("span","nm",name));
    r.onclick=()=>{const open=kids.style.display!=="none";
      kids.style.display=open?"none":""; r.firstChild.textContent=open?"▸":"▾";};
    li.append(r,kids); parent.append(li); renderTree(node.dirs[name],kids);
  }
  for(const f of node.files.sort((a,b)=>a.name.localeCompare(b.name))){
    const li=el("li"), r=el("div","row file");
    r.append(el("span","tw",""), el("span","nm",f.name));
    f.row=r; INDEX.set(f.path,f);
    r.onclick=()=>openFile(f,r);
    li.append(r); parent.append(li);
  }
}

/* ---------- slides ---------- */
let CUR={slides:null,i:0,path:null};
const HIST=[];                       // discrete jumps only, never arrow-key paging
function pushHist(){ if(CUR.path) HIST.push({path:CUR.path,i:CUR.i}); syncBack(); }
function syncBack(){ $("#b-back").disabled=!HIST.length;
  $("#b-back").title=HIST.length?`Back to ${HIST[HIST.length-1].path.split("/").pop()} (Alt+\u2190)`:"Back"; }
async function goBack(){
  const h=HIST.pop(); syncBack();
  if(!h) return;
  if(h.path!==CUR.path){
    const f=INDEX.get(h.path); if(!f) return;
    await openFile(f,f.row,true);
  }
  show(h.i);
}
async function openFile(f,row,noHist){
  if(!noHist) pushHist();
  let text=await f.get();
  text=String(text).replace(/^\uFEFF/,"").replace(/\r\n?/g,"\n");
  CUR={slides:slides(text),i:0,path:f.path};
  document.querySelectorAll(".row.on").forEach(n=>n.classList.remove("on"));
  if(row) row.classList.add("on");
  buildOutline();
  show(0);
}
function buildOutline(){
  const box=$("#outline"); box.textContent="";
  $("#rcount").textContent=CUR.slides?CUR.slides.length:"—";
  if(!CUR.slides) return;
  CUR.slides.forEach((s,i)=>{
    const r=el("div","orow l"+(s.level||2));
    r.append(el("span","n",String(i+1)),
             el("span","t",s.title+(s.part?` (${s.part[0]}/${s.part[1]})`:"")));
    r.onclick=()=>{ pushHist(); show(i); };
    box.append(r);
  });
}
function markOutline(i){
  const rows=$("#outline").children;
  for(const r of rows) r.classList.remove("on");
  if(rows[i]){ rows[i].classList.add("on");
    rows[i].scrollIntoView({block:"nearest"}); }
}

function resolvePath(base,href){
  const dir=base.split("/").slice(0,-1);
  const out=href.startsWith("/")?[]:dir.slice();
  for(const p of href.replace(/^\//,"").split("/")){
    if(p==="."||p==="") continue;
    if(p==="..") out.pop(); else out.push(p);
  }
  return out.join("/");
}
function slideForAnchor(anchor){
  const want=anchor.replace(/^#/,"").toLowerCase();
  return CUR.slides.findIndex(s=>slug(s.title)===want);
}
const slug=t=>t.toLowerCase().replace(/[^\w\s-]/g,"").trim().replace(/\s+/g,"-");

function wireLinks(){
  doc.querySelectorAll("a[href]").forEach(a=>{
    const href=a.getAttribute("href");
    if(/^(https?|mailto):/i.test(href)){
      a.classList.add("ext"); a.target="_blank"; a.rel="noopener noreferrer"; return;
    }
    if(href.startsWith("#")){
      a.onclick=e=>{ e.preventDefault();
        const i=slideForAnchor(href);
        if(i>=0){ pushHist(); show(i); } else a.classList.add("dead"); };
      return;
    }
    const [rel,anchor]=href.split("#");
    const target=resolvePath(CUR.path,decodeURIComponent(rel));
    const f=INDEX.get(target);
    if(!f){ a.classList.add("dead"); a.title=target+" is not in the opened folder";
            a.onclick=e=>e.preventDefault(); return; }
    a.title=target;
    a.onclick=async e=>{
      e.preventDefault();
      await openFile(f,f.row);
      if(anchor){ const i=slideForAnchor(anchor); if(i>=0) show(i); }
      syncBack();
    };
  });
}

function show(i){
  if(!CUR.slides) return;
  const n=CUR.slides.length; i=Math.max(0,Math.min(i,n-1)); CUR.i=i;
  const s=CUR.slides[i];
  crumb.textContent=`${CUR.path}  ·  ${n} section${n===1?"":"s"}  ·  ${s.title}`
    +(s.part?`  (${s.part[0]}/${s.part[1]})`:"")+(HAS_MD?"":"   \u26a0 markdown renderer failed \u2014 showing raw text");
  if(HAS_MD){
    try{ marked.setOptions({gfm:true,breaks:false}); doc.innerHTML=marked.parse(s.md); }
    catch(err){ doc.textContent=""; doc.append(el("pre",null,s.md)); }
    doc.querySelectorAll("pre code.language-mermaid").forEach(c=>{
      const w=el("div","mermaid",c.textContent); c.closest("pre").replaceWith(w);});
    const failCap=msg=>doc.querySelectorAll(".mermaid").forEach(m=>
      m.parentNode.insertBefore(el("div","mermaid-fail",msg),m));
    if(typeof mermaid==="undefined")
      failCap("diagram not rendered \u2014 mermaid failed to load (offline?)");
    else
      try{ mermaid.run({nodes:doc.querySelectorAll(".mermaid")}); }
      catch(err){ failCap("diagram not rendered \u2014 mermaid error: "+err.message); }
  } else { doc.textContent=""; doc.append(el("pre",null,s.md)); }
  wireLinks();
  $("#stage").scrollTop=0;
  $("#pos").textContent=`${i+1} / ${n}`;
  markOutline(i);
  $("#b-home").disabled=$("#b-prev").disabled=(i===0);
  $("#b-end").disabled=$("#b-next").disabled=(i===n-1);
}
$("#b-back").onclick=goBack;
$("#b-next").onclick=()=>show(CUR.i+1);
$("#b-prev").onclick=()=>show(CUR.i-1);
$("#b-home").onclick=()=>show(0);
$("#b-end").onclick=()=>show(CUR.slides?CUR.slides.length-1:0);
addEventListener("keydown",e=>{
  if(!CUR.slides||e.target.tagName==="INPUT") return;
  const k={ArrowRight:1,PageDown:1,ArrowLeft:-1,PageUp:-1}[e.key];
  if(e.altKey&&e.key==="ArrowLeft"){goBack();e.preventDefault();return;}
  if(e.key==="Backspace"){goBack();e.preventDefault();return;}
  if(k){show(CUR.i+k);e.preventDefault();return;}
  if(e.key==="Home"){show(0);e.preventDefault();}
  if(e.key==="End"){show(CUR.slides.length-1);e.preventDefault();}
});

let drag=false;
$("#grip").onmousedown=()=>{drag=true;document.body.style.userSelect="none"};
addEventListener("mouseup",()=>{drag=false;document.body.style.userSelect=""});
let rdrag=false;
$("#rgrip").onmousedown=()=>{rdrag=true;document.body.style.userSelect="none"};
addEventListener("mouseup",()=>{rdrag=false});
addEventListener("mousemove",e=>{
  if(drag) $("#side").style.width=Math.max(140,e.clientX)+"px";
  if(rdrag) $("#right").style.width=Math.max(130,innerWidth-e.clientX)+"px";
});
</script></body></html>
